[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shop_model"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
	"pandas>=2.0",
	"scikit-learn>=1.4",
	"joblib>=1.3",
	"pyyaml>=6.0",
	"python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
shop-train = "shop_model.train:main"


